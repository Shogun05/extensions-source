name: Build and publish extensions

on:
  push:
    branches: [main, add-mangaraw]
    paths:
      - src/**
      - lib/**
      - lib-multisrc/**
      - core/**
      - compiler/**
      - common/**
      - gradle/**
      - gradlew
      - '*.gradle.kts'
      - gradle.properties
      - .editorconfig
      - .github/scripts/**
      - .github/workflows/build_and_publish.yml
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild and publish every extension
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-shogun-extensions
  cancel-in-progress: false

env:
  EXTENSION_REPO: Shogun05/extensions
  CI_CHUNK_SIZE: 40
  IS_PR_CHECK: false

jobs:
  prepare:
    if: github.repository == 'Shogun05/extensions-source'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      delete: ${{ steps.matrix.outputs.delete }}
      full_rebuild: ${{ steps.base.outputs.full_rebuild || steps.matrix.outputs.full_rebuild }}
      signing_key: ${{ steps.credentials.outputs.signing_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check publishing token and persistent signing key
        id: credentials
        env:
          GH_TOKEN: ${{ secrets.EXTENSIONS_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          for variable in GH_TOKEN SIGNING_KEY KEY_STORE_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing publishing credentials. Follow .github/BUILDING.md before running this workflow."
              exit 1
            fi
          done
          test "$(gh api "repos/$EXTENSION_REPO" --jq '.permissions.push')" = true
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/extensions.jks"
          keytool -exportcert -keystore "$RUNNER_TEMP/extensions.jks" -alias extensions \
            -storepass:env KEY_STORE_PASSWORD > "$RUNNER_TEMP/extensions.der"
          fingerprint=$(sha256sum "$RUNNER_TEMP/extensions.der" | cut -d ' ' -f 1)
          echo "signing_key=$fingerprint" >> "$GITHUB_OUTPUT"
          rm "$RUNNER_TEMP/extensions.jks" "$RUNNER_TEMP/extensions.der"

      - name: Determine rebuild base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_REBUILD: ${{ inputs.full_rebuild }}
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          if [ "$FULL_REBUILD" = true ]; then
            sha=$empty_tree
          else
            sha=$(python .github/scripts/find-base-sha.py build_and_publish.yml)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$empty_tree" ]; then
            echo 'full_rebuild=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate build matrix
        id: matrix
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python .github/scripts/generate-build-matrices.py "$BASE_SHA"

  build:
    name: Build extension batch ${{ matrix.chunk.number }}
    needs: prepare
    if: needs.prepare.outputs.delete != '[]' && fromJSON(needs.prepare.outputs.matrix).chunk[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '16111833'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | base64 --decode > signingkey.jks

      - name: Compile signed release APKs and lint
        env:
          MODULES: ${{ join(matrix.chunk.modules, ' ') }}
          ALIAS: extensions
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          TASKS=()
          for module in $MODULES; do
            TASKS+=("${module}:assembleRelease" "${module}:lintRelease")
          done
          ./gradlew "${TASKS[@]}"

      - name: Upload release APKs and source metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-batch-${{ matrix.chunk.number }}
          path: |
            src/**/build/outputs/apk/release/*.apk
            src/**/build/outputs/jar/release/*.jar
            src/**/build/keiyoushi-source-info.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing key
        if: always()
        run: rm -f signingkey.jks

  publish:
    name: Publish Releases and Mihon catalogue
    needs: [prepare, build]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.prepare.outputs.delete != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Shogun05/extensions
          ref: repo
          path: catalogue
          token: ${{ secrets.EXTENSIONS_TOKEN }}
          persist-credentials: true

      - name: Download built APKs
        if: needs.build.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: extension-batch-*
          path: ~/apk-artifacts

      - name: Install catalogue dependency
        run: pip install 'protobuf>=7.35.1,<8'

      - name: Publish release assets and update index
        env:
          GH_TOKEN: ${{ secrets.EXTENSIONS_TOKEN }}
          DELETE: ${{ needs.prepare.outputs.delete }}
          FULL_REBUILD: ${{ needs.prepare.outputs.full_rebuild }}
          EXPECTED_MATRIX: ${{ needs.prepare.outputs.matrix }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.sha }}
          STORE_NAME: Shogun05 Extensions
          STORE_BADGE: SHOGUN
          STORE_WEBSITE: https://github.com/Shogun05/extensions-source
          STORE_SIGNING_KEY: ${{ needs.prepare.outputs.signing_key }}
        run: |
          cd catalogue
          python -u ../source/.github/scripts/publish-repo.py "$DELETE" "$GITHUB_SHA" "$FULL_REBUILD"
          git config user.name 'Shogun05'
          git config user.email '37658516+Shogun05@users.noreply.github.com'
          git add index.json index.pb index.html repo.json release-assets.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish rebuilt extensions'
            git push origin HEAD:repo
          fi
