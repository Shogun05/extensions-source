name: Build MangaRaw APK

on:
  push:
    paths:
      - src/ja/mangaraw/**
      - core/**
      - compiler/**
      - common/**
      - gradle/**
      - gradlew
      - gradle.properties
      - settings.gradle.kts
      - build.gradle.kts
      - .editorconfig
      - .github/workflows/build_mangaraw.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangaraw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint MangaRaw
    if: github.repository == 'Shogun05/extensions-source'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '16111833'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'

      - name: Build APK and run release lint
        run: ./gradlew :src:ja:mangaraw:assembleDebug :src:ja:mangaraw:lintRelease

      - name: Upload installable APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mangaraw-apk
          path: src/ja/mangaraw/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mangaraw-lint
          path: src/ja/mangaraw/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 7
